<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020d1a"/>
      <stop offset="100%" style="stop-color:#0a2233"/>
    </linearGradient>
    <linearGradient id="shrimp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c9a7"/>
      <stop offset="100%" style="stop-color:#00e5ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ffd166"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#00c9a7" stroke-width="1" opacity="0.1"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#00c9a7" stroke-width="1" opacity="0.1"/>
  <!-- Circuit dots -->
  <circle cx="140" cy="140" r="4" fill="#00c9a7" opacity="0.3"/>
  <circle cx="372" cy="140" r="4" fill="#00c9a7" opacity="0.3"/>
  <circle cx="140" cy="372" r="4" fill="#00c9a7" opacity="0.3"/>
  <circle cx="372" cy="372" r="4" fill="#00c9a7" opacity="0.3"/>
  <!-- Shrimp body (stylized C-curve) -->
  <path d="M 320 130 Q 370 180 360 240 Q 350 300 300 330 Q 250 360 200 340 Q 160 320 155 280 Q 150 240 175 210 Q 195 185 220 195 Q 245 205 240 230 Q 235 255 215 260 Q 200 262 195 250" 
        stroke="url(#shrimp)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Antenna 1 -->
  <line x1="320" y1="130" x2="280" y2="75" stroke="url(#shrimp)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Antenna 2 -->
  <line x1="320" y1="130" x2="355" y2="80" stroke="url(#shrimp)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Tail fan -->
  <path d="M 195 250 Q 170 275 155 295" stroke="url(#shrimp)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 195 250 Q 175 285 175 310" stroke="url(#shrimp)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 195 250 Q 185 290 195 315" stroke="url(#shrimp)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Data pulse dots on shrimp -->
  <circle cx="290" cy="160" r="6" fill="#ffd166"/>
  <circle cx="330" cy="200" r="5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="310" cy="265" r="5" fill="#ff6b35" opacity="0.8"/>
  <circle cx="250" cy="315" r="6" fill="#ffd166" opacity="0.9"/>
  <!-- Eye -->
  <circle cx="328" cy="128" r="10" fill="#00c9a7"/>
  <circle cx="330" cy="126" r="5" fill="#020d1a"/>
  <circle cx="332" cy="124" r="2" fill="#fff"/>
  <!-- Small chart bars bottom right -->
  <rect x="355" y="350" width="12" height="40" rx="2" fill="#00c9a7" opacity="0.4"/>
  <rect x="372" y="335" width="12" height="55" rx="2" fill="#00c9a7" opacity="0.6"/>
  <rect x="389" y="320" width="12" height="70" rx="2" fill="#00c9a7" opacity="0.9"/>
  <rect x="406" y="340" width="12" height="50" rx="2" fill="#ffd166" opacity="0.8"/>
</svg>
